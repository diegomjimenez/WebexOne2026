[project]
name = "webex-mcp-lab"
version = "0.1.0"
description = "WebexOne hands-on lab: build a Webex MCP server one concept at a time."
requires-python = ">=3.10"
dependencies = [
    # Upper bound is deliberate: 2.x renamed FastMCP to MCPServer and moved it,
    # so an unpinned major version silently breaks every script here.
    "mcp>=2.1,<3",
    "httpx>=0.27",
]

# Nothing here is an importable package: the numbered scripts are run by path,
# and 08_modular cannot be a package name because it starts with a digit.
# This file exists to declare dependencies, not to build anything.
[tool.uv]
package = false
